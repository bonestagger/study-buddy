<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282A2C"/>
      <stop offset="100%" stop-color="#1E1F20"/>
    </linearGradient>
    <filter id="subtleGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered Classroom Sheet Symbol within safe 80% circle -->
  <g transform="translate(136, 120) scale(0.8)" filter="url(#subtleGlowMask)">
    <!-- Back page sheet -->
    <rect x="24" y="24" width="250" height="290" rx="20" fill="#313335" stroke="#4B4E52" stroke-width="3"/>
    
    <!-- Front main worksheet sheet -->
    <rect x="0" y="0" width="250" height="290" rx="20" fill="#FFFFFF"/>
    
    <!-- Sheet Header Bar -->
    <rect x="0" y="0" width="250" height="56" rx="20" fill="#202124"/>
    <rect x="0" y="36" width="250" height="20" fill="#202124"/>
    
    <!-- Header Title / Dots -->
    <circle cx="28" cy="28" r="6" fill="#EA4335"/>
    <circle cx="48" cy="28" r="6" fill="#FBBC04"/>
    <circle cx="68" cy="28" r="6" fill="#34A853"/>
    
    <text x="215" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#E8EAED" text-anchor="end">8-B</text>

    <!-- Worksheet Ruled Content Lines -->
    <rect x="30" y="90" width="130" height="12" rx="6" fill="#202124"/>
    <rect x="30" y="122" width="190" height="8" rx="4" fill="#DADCE0"/>
    <rect x="30" y="146" width="170" height="8" rx="4" fill="#DADCE0"/>
    <rect x="30" y="170" width="190" height="8" rx="4" fill="#DADCE0"/>
    <rect x="30" y="194" width="140" height="8" rx="4" fill="#DADCE0"/>

    <!-- Subject Checkmark / Stamp -->
    <circle cx="190" cy="235" r="28" fill="#F1F3F4" stroke="#DADCE0" stroke-width="2"/>
    <text x="190" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" text-anchor="middle" fill="#202124">📐</text>
  </g>

  <!-- Bottom App Label -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#E8EAED" letter-spacing="1" text-anchor="middle">ICSE GRADE 8</text>
</svg>
